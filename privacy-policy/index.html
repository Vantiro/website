<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Privacy Policy | Vantiro</title>
  <meta name="description" content="Read the Vantiro privacy and cookie policy." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="../assets/style/common.css" rel="stylesheet" />

  <style>
    body {
      min-height: 100vh;
    }

    .policy-shell {
      padding-top: 7.5rem;
      padding-bottom: 3rem;
    }

    .policy-card {
      overflow: hidden;
    }

    .policy-frame-wrap {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: calc(var(--v-radius) - 2px);
      overflow: hidden;
      background: rgba(255,255,255,.02);
      min-height: 72vh;
    }

    .policy-frame {
      display: block;
      width: 100%;
      min-height: 72vh;
      border: 0;
      background: #fff;
    }
  </style>
</head>

<body class="bg-grid">
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top py-3 v-solid" id="topNav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <span class="brand-mark"></span>
        Vantiro
      </a>

      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="text-decoration-none text-muted-v small" href="/">Back to home</a>
      </div>
    </div>
  </nav>

  <main class="policy-shell">
    <div class="container">
      <div class="v-surface policy-card p-4 p-md-5">
        <div class="mb-4">
          <div>
            <div class="v-pill mb-3">
              <i class="bi bi-shield-lock-fill"></i>
              <span>Legal</span>
            </div>
            <h1 class="h2 mb-2">Privacy Policy</h1>
            <p class="text-muted-v mb-0">This page embeds the official Iubenda policy for Vantiro.</p>
          </div>
        </div>

        <div class="policy-frame-wrap">
          <iframe
            id="policyFrame"
            class="policy-frame"
            title="Vantiro policy"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            src="https://www.iubenda.com/privacy-policy/97165499"
          ></iframe>
        </div>
      </div>
    </div>
  </main>

  <script>
    const privacyUrl = 'https://www.iubenda.com/privacy-policy/97165499';
    const cookieUrl = 'https://www.iubenda.com/privacy-policy/97165499/cookie-policy';
    const frame = document.getElementById('policyFrame');

    function syncPolicyView() {
      const isCookieView = window.location.hash === '#cookie-policy';
      const nextSrc = isCookieView ? cookieUrl : privacyUrl;
      const nextTitle = isCookieView ? 'Cookie Policy | Vantiro' : 'Privacy Policy | Vantiro';
      const nextHeading = isCookieView ? 'Cookie Policy' : 'Privacy Policy';

      if (frame.src !== nextSrc) {
        frame.src = nextSrc;
      }

      document.title = nextTitle;
      document.querySelector('h1').textContent = nextHeading;
    }

    syncPolicyView();
    window.addEventListener('hashchange', syncPolicyView);
  </script>
</body>
</html>
